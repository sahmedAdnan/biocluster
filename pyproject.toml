[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocluster"
version = "0.1.0"
description = "BioCLuster: A Framework for Clustering and Zero-Shot Labeling of Ecological Images Using Foundation Models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Shakil Ahmed", email = "ahshakil.au@gmail.com" },
  { name = "Kim Bjerge", email = "kbe@ece.au.dk" },
  { name = "Toke T. Høye", email = "tth@ecos.au.dk" },
  { name = "Christian Nørgaard Storm Pedersen", email = "cstorm@birc.au.dk" },
]
keywords = ["biodiversity", "clustering", "BioCLIP", "camera-trap",
            "zero-shot", "species-identification", "active-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "open_clip_torch>=2.24.0",
  "timm>=0.9.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "umap-learn>=0.5.5",
  "hdbscan>=0.8.33",
  "tqdm>=4.65.0",
  "PyYAML>=6.0",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["PySide6==6.7.2", "plotly>=5.10.0", "pyqt-darktheme>=2.1.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "nbformat>=5.9"]
all = ["biocluster[gui,dev]"]

[project.scripts]
biocluster-gui       = "biocluster.app.main:main"
biocluster-extract   = "biocluster.cli.extract:main"
biocluster-cluster   = "biocluster.cli.cluster:main"
biocluster-evaluate  = "biocluster.cli.evaluate:main"
biocluster-annotate  = "biocluster.cli.annotate:main"
biocluster-pipeline  = "biocluster.pipelines.run_pipeline:main"

[project.urls]
Homepage = "https://github.com/sahmedAdnan/biocluster"
Issues = "https://github.com/sahmedAdnan/biocluster/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biocluster = ["app/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# main.py is a 3k-line Qt application written before this layout existed; it is
# checked by the test suite (it must import) rather than by the linter.
exclude = ["src/biocluster/app/main.py"]

[tool.ruff.lint]
# Real errors only: undefined names, unused imports, unused locals, broken
# syntax. Stylistic rules are not enforced; reformatting working research code
# would change behaviour for no benefit.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# theme.py injects its palette into module globals at import time
# (globals().update(PALETTES[ACTIVE])), which static analysis cannot follow.
"src/biocluster/app/theme.py" = ["F821"]
# __init__.py re-exports on purpose.
"**/__init__.py" = ["F401"]
