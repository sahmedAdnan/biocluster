# ===========================================================================
# DK-Moth (sub)  x  DINOv2
#
# Reproduces one row of Table 3 (tab:backbones): the backbone comparison under
# HDBSCAN, each backbone at its own selected reduction.
#
#   Reduction      : UMAP-20
#   HDBSCAN        : min_cluster_size=4, min_samples=2, selection=leaf
#   Reported ARI   : 0.434
#   Reported NMI   : 0.841
#   Reported Hung. : 0.578
#   Clusters       : 230 (reference partition has 248)
#   Noise          : 26.4%
#
# Mean over ten subsamples in the paper; this config runs ONE of them.
# Camera-trap imagery. The paper reports the mean over ten balanced
# subsamples: all 248 classes with >=5 images, up to 10 images each. Point
# `root` at one subsample and repeat.
#
# Settings come from the logged run in run_history.csv.
# ===========================================================================

dataset:
  name: mothdk
  format: imagefolder
  root: /path/to/dataset        # <-- one balanced subsample folder, e.g. DK-moth_run01_seed42
  image_extensions: [jpg, jpeg, png, webp]
  num_classes: 248

model:
  name: dinov2
  pretrained: vit_large_patch14_dinov2.lvd142m
  normalize_embeddings: true
  batch_size: 32
  num_workers: 4
  global_pool: token          # CLS token, per the paper footnote

  # No text encoder: this backbone can cluster but cannot name clusters.

reduction:
  method: umap
  n_components: 20
  n_neighbors: 15
  min_dist: 0.15
  metric: cosine

# HDBSCAN only: it finds the cluster count itself and supplies the
# membership probability the uncertainty score needs.
clustering:
  methods:
    - name: hdbscan
      min_cluster_size: 4
      min_samples: 2
      cluster_selection_method: leaf

hdbscan:
  sweep_range: [4]          # the published value, not a sweep
  cluster_selection_method: leaf

evaluation:
  top_k_confusion: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/paper/dkmoth_sub/backbone_dinov2
seed: 42
