# ===========================================================================
# HUGO-Bench Aves (sub)  x  DINOv3
#
# Reproduces one row of Table 3 (tab:backbones): the backbone comparison under
# HDBSCAN, each backbone at its own selected reduction.
#
#   Reduction      : UMAP-10
#   HDBSCAN        : min_cluster_size=70, min_samples=7, selection=leaf
#   Reported ARI   : 0.920
#   Reported NMI   : 0.942
#   Reported Hung. : 0.949
#   Clusters       : 31 (reference partition has 30)
#   Noise          : 2.6%
#
# Mean over ten subsamples in the paper; this config runs ONE of them.
# Camera-trap imagery. The paper reports the mean over ten subsamples of
# exactly 200 images from each of 30 classes, matching the original HUGO-
# Bench protocol.
#
# Settings come from the logged run in run_history.csv.
#
# CAVEAT: the only ten-run group in run_history gives ARI 0.9243, 31.2
# clusters and 3.66% noise, against the published 0.920, 31 and 2.6%.
# The cache holds two DINOv3 extractions per subsample, default pooling
# and CLS token, and the history records neither, so the published row is
# most likely the CLS-token one set below. Only a re-run settles it.
# ===========================================================================

dataset:
  name: hugoaves
  format: imagefolder
  root: /path/to/dataset        # <-- one balanced subsample folder, e.g. aves_200_run0
  image_extensions: [jpg, jpeg, png, webp]
  num_classes: 30

model:
  name: dinov3
  pretrained: vit_huge_plus_patch16_dinov3.lvd1689m
  normalize_embeddings: true
  batch_size: 32
  num_workers: 4
  global_pool: token          # CLS token, per the paper footnote

  # No text encoder: this backbone can cluster but cannot name clusters.

reduction:
  method: umap
  n_components: 10
  n_neighbors: 70
  min_dist: 0.25
  metric: cosine

# HDBSCAN only: it finds the cluster count itself and supplies the
# membership probability the uncertainty score needs.
clustering:
  methods:
    - name: hdbscan
      min_cluster_size: 70
      min_samples: 7
      cluster_selection_method: leaf

hdbscan:
  sweep_range: [70]          # the published value, not a sweep
  cluster_selection_method: leaf

evaluation:
  top_k_confusion: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/paper/hugoaves_sub/backbone_dinov3
seed: 42
