# ===========================================================================
# CUB-200-2011  x  DINOv2
#
# Reproduces one row of Table 3 (tab:backbones): the backbone comparison under
# HDBSCAN, each backbone at its own selected reduction.
#
#   Reduction      : UMAP-5
#   HDBSCAN        : min_cluster_size=10, min_samples=5, selection=eom
#   Reported ARI   : 0.715
#   Reported NMI   : 0.924
#   Reported Hung. : 0.767
#   Clusters       : 216 (reference partition has 200)
#   Noise          : 4.98%
#
# Single fixed run.
# Curated benchmark, ~59 images per species.
#
# Settings come from the logged run in run_history.csv.
# ===========================================================================

dataset:
  name: cub200
  format: imagefolder
  root: /path/to/dataset        # <-- CUB_200_2011 images folder (200 species subfolders)
  image_extensions: [jpg, jpeg, png, webp]
  num_classes: 200

model:
  name: dinov2
  pretrained: vit_large_patch14_dinov2.lvd142m
  normalize_embeddings: true
  batch_size: 32
  num_workers: 4
  global_pool: token          # CLS token, per the paper footnote

  # No text encoder: this backbone can cluster but cannot name clusters.

reduction:
  method: umap
  n_components: 5
  n_neighbors: 30
  min_dist: 0.2
  metric: cosine

# HDBSCAN only: it finds the cluster count itself and supplies the
# membership probability the uncertainty score needs.
clustering:
  methods:
    - name: hdbscan
      min_cluster_size: 10
      min_samples: 5
      cluster_selection_method: eom

hdbscan:
  sweep_range: [10]          # the published value, not a sweep
  cluster_selection_method: eom

evaluation:
  top_k_confusion: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/paper/cub200/backbone_dinov2
seed: 42
