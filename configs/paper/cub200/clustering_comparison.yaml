# ===========================================================================
# CUB-200-2011  -  all six clustering algorithms  (BioCLIP 2, ViT-H/14)
#
# Reproduces one block of Table 2 (tab:clustering): the per-method comparison
# on a fixed backbone and reduction, so only the algorithm varies.
#
#   Reduction : PCA-150+UMAP-5
#   Fixed-K   : K = 200 (the known species count)
#   DBSCAN    : eps=0.08, min_samples=5
#   HDBSCAN   : min_cluster_size=25, min_samples=3, selection=eom
#
# Single fixed run.
#
# Noise points are excluded from ARI/NMI/Hungarian, so read every score beside
# the noise fraction: a method that abstains more is graded on an easier
# subset.
# ===========================================================================

dataset:
  name: cub200
  format: imagefolder
  root: /path/to/dataset        # <-- CUB_200_2011 images folder (200 species subfolders)
  image_extensions: [jpg, jpeg, png, webp]
  num_classes: 200

model:
  name: bioclip2.5
  pretrained: hf-hub:imageomics/bioclip-2.5-vith14
  normalize_embeddings: true
  batch_size: 32
  num_workers: 4

  # Ranks missing from the taxonomy are dropped from the prompt.
  prompt_templates:
    - "a photo of {order} {family} {genus} {name}"

reduction:
  method: pca+umap
  n_components: 5
  pca_components: 150       # linear stage before UMAP
  n_neighbors: 30
  min_dist: 0.15
  metric: cosine

clustering:
  methods:
    - name: kmeans
      n_clusters: 200
      n_init: 50
      max_iter: 500
      random_state: 42

    - name: agglomerative
      n_clusters: 200
      linkage: ward

    - name: spectral
      n_clusters: 200
      n_neighbors: 30

    - name: gmm
      n_clusters: 200
      covariance_type: full
      max_iter: 300
      random_state: 42

    - name: dbscan
      eps: 0.08
      min_samples: 5

    - name: hdbscan
      min_cluster_size: 25
      min_samples: 3
      cluster_selection_method: eom

# eps is an absolute radius, so it is valid only for the reduction above.
# Re-derive it with scripts/pick_dbscan_eps.py if you change that.
dbscan:
  eps: 0.08
  min_samples: 5

hdbscan:
  sweep_range: [25]
  cluster_selection_method: eom

evaluation:
  top_k_confusion: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

annotation:
  species_source: dataset       # candidates = the dataset's class names
  taxonomy_source: names        # genus parsed from the name; no network
  # taxonomy_file: path/to/classes_with_family.csv   # adds family and order

  uncertainty:
    # Absolute, not percentile.
    review_threshold: 0.55      # combined >= 0.55 -> review
    human_threshold: 0.70       # combined >= 0.70 -> human_required
    weights:
      text_margin: 0.35
      membership_probability: 0.25
      cluster_agreement: 0.25
      taxonomic_consistency: 0.15

  include_sanity_check: true
  n_sanity: 25

output_dir: results/paper/cub200/clustering_comparison
seed: 42
